spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  slots:
    min-duration-minutes: 5
    max-duration-minutes: 480
    max-future-days: 365
    max-page-size: 200
  aggregate:
    cache-ttl-seconds: 30

logging:
  level:
    root: WARN
    com.minidoodle: INFO
